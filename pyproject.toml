[project]
name = "sorabel-gateway"
version = "0.1.0"
description = "Sorabel Data Gateway — point d'accès unique aux données Sorabel (corpus documentaire + base SQL) via un serveur MCP"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "chromadb>=0.5,<0.6",
    "mcp>=1.2,<2",
    "pyyaml>=6.0,<7",
    "pypdf>=4.2,<6",
    "beautifulsoup4>=4.12,<5",
    "markdown>=3.6,<4",
    "rank-bm25>=0.2,<0.3",
    "openai>=1.50,<2",
    "streamlit>=1.38,<2",
    "langfuse>=4.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.30",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
    "types-Markdown>=3.6,<4",
    "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "ingest*", "retrieval*", "sql*", "mcp_server*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # Interne à chromadb (accès à model_fields sur l'instance), pas notre code.
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*:pydantic.warnings.PydanticDeprecatedSince211",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
