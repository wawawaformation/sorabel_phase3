services:
  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8002:8000"
    volumes:
      - ./.docker-data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=${PUBLIC_HOSTNAME:-localhost}
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT:-8180}
      - KC_HTTP_ENABLED=true
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 24

  gateway:
    build: .
    ports:
      - "8090:8080"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    environment:
      - CHROMA_URL=http://chroma:8000
      - KEYCLOAK_ISSUER=http://${PUBLIC_HOSTNAME:-localhost}:${KEYCLOAK_PORT:-8180}/realms/sorabel
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
    # Utile seulement quand PUBLIC_HOSTNAME=localhost (poste de dev) : sans lui, le
    # conteneur gateway ne se verrait pas lui-même à l'adresse qu'il vient de valider
    # dans un jeton. Inoffensif sur un vrai déploiement (PUBLIC_HOSTNAME = domaine ou
    # IP publique) : personne ne cherche à résoudre "localhost" dans ce cas.
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ui:
    # Même image que gateway (rien à reconstruire), commande différente : l'interface
    # de démo (app_gateway.py) est un client MCP autonome (stdio + SORABEL_PROFILE,
    # comme scripts/mcp_client.py) — elle ne passe pas par le serveur HTTP/Keycloak,
    # mais a besoin des mêmes données (SQLite, Chroma) qu'il a déjà provisionnées.
    build: .
    command: ["uv", "run", "--no-dev", "streamlit", "run", "app_gateway.py",
              "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    environment:
      - CHROMA_URL=http://chroma:8000
    depends_on:
      - gateway
