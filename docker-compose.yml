services:
  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8002:8000"
    volumes:
      - ./.docker-data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8180
      - KC_HTTP_ENABLED=true
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo ok"]
      interval: 5s
      timeout: 3s
      retries: 24

  gateway:
    build: .
    ports:
      - "8090:8080"
    volumes:
      - ./data/corpus:/app/data/corpus:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file: .env
    environment:
      - CHROMA_URL=http://chroma:8000
      - KEYCLOAK_ISSUER=http://localhost:8180/realms/sorabel
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
      keycloak:
        condition: service_healthy
