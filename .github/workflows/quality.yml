name: quality

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync
      - name: Seed
        run: uv run python scripts/seed.py
      - name: Lint
        run: uv run ruff check .
      - name: Acceptance
        run: uv run pytest -q
